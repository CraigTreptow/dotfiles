# Sandi Metz's rules 1-3, checked by the Claude Code Stop hook.
AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "db/**/*"
    - "bin/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

Metrics/ClassLength:
  Enabled: true
  Max: 100

Metrics/MethodLength:
  Enabled: true
  Max: 5

Metrics/ParameterLists:
  Enabled: true
  Max: 4
